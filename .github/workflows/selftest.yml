name: Self-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Behavioral contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml

      - name: Run the contract tests
        run: python -m unittest discover -s selftests -v

      # The examples are documentation. If they stop parsing, the documentation
      # is wrong, which is exactly the failure this project exists to catch.
      - name: Validate the shipped example configuration
        run: |
          cp docs-testing.config.example.yml /tmp/docs-testing.config.yml
          python -m docs_testing validate --config /tmp/docs-testing.config.yml

      - name: Validate the examples
        run: |
          for example in examples/*/; do
            echo "--- $example"
            ( cd "$example" && PYTHONPATH="$GITHUB_WORKSPACE" \
                python -m docs_testing validate ) || exit 1
          done

      - name: Check the minimal example still behaves as documented
        working-directory: examples/minimal
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" python -m docs_testing run --output /tmp/minimal.json
          python - <<'PY'
          import json
          summary = json.load(open("/tmp/minimal.json"))["summary"]
          assert summary["status"] == "warn", summary
          assert summary["warnings"] == 1, summary
          PY
