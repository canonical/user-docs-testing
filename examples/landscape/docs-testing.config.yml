# Landscape — a worked configuration for a product implemented across several
# repositories, most of them private.
#
# This is the complicated end of the spectrum. Start from examples/minimal if you
# just want to see the common case. See README.md in this folder for what it
# demonstrates and how to run it.

version: 1

# All Landscape reference documentation, minus material that is not source-backed.
targets: "docs/reference/**/*.md"
exclude:
  # Narrative, not source-backed reference.
  - "docs/reference/release-notes/**"
  - "docs/reference/known-issues.md"
  # Shared include fragments are not standalone reference pages.
  - "docs/reference/_includes/**"

# ---------------------------------------------------------------------------
# Sources of truth, one per component that owns some in-scope reference material.
# `auth` names a GitHub secret holding a read token (Contents: Read); the token
# never appears in this file. Confirm private repository names against your own
# access rather than guessing.
# ---------------------------------------------------------------------------
sources:
  # Public. Authoritative for client commands and client-side configuration.
  - name: landscape-client
    repo: canonical/landscape-client
    ref: main
    required: true

  # Private, and the primary source for server-side reference: service.conf and
  # LANDSCAPE_* variables, lsctl and the other server CLIs, systemd services,
  # file and log paths, cron jobs, database schema, routes, roles, and activities.
  # Required: if it cannot be read, server-side documentation is reported as
  # blocked, never as passing.
  - name: landscape-server
    repo: canonical/landscape-server
    ref: main
    auth: secret:SOURCE_REPO_TOKEN
    required: true

  # Private, optional. Authoritative for server charm options and relations only.
  - name: landscape-server-operator
    repo: canonical/landscape-server-operator
    ref: main
    auth: secret:SOURCE_REPO_TOKEN
    required: false

  # Private, optional. Authoritative for current web-portal terminology and field
  # labels; the server still owns the semantics behind them.
  - name: landscape-ui
    repo: canonical/landscape-ui
    ref: main
    auth: secret:SOURCE_REPO_TOKEN
    required: false

# ---------------------------------------------------------------------------
# Ownership. Each area is checked against the component that PRODUCES it; other
# sources may corroborate but do not override. Derived from the actual reference
# docs — the config/ pages document the server's service.conf, for instance, so
# they are server-owned rather than client-owned.
# ---------------------------------------------------------------------------
source_map:
  - area: "Server configuration (service.conf, LANDSCAPE_* env vars)"
    paths: ["docs/reference/config/**"]
    sources: [landscape-server]

  - area: "Landscape Server CLI (lsctl and friends)"
    paths: ["docs/reference/lsctl.md"]
    sources: [landscape-server]

  - area: "Database reference (schema, tables, migrations)"
    paths: ["docs/reference/database.md"]
    sources: [landscape-server]

  - area: "Server services, processes, and logs"
    paths:
      - "docs/reference/logs.md"
      - "docs/reference/networking/**"
    sources: [landscape-server]

  - area: "Server charm options and relations"
    paths: ["docs/reference/charm/**"]
    sources: [landscape-server-operator]

  - area: "Web-portal terminology and domain concepts"
    paths: ["docs/reference/terms/**"]
    # The server owns the semantics; the UI owns the current field labels.
    sources: [landscape-server, landscape-ui]

  - area: "Supported versions, PPAs, and package policy"
    paths: ["docs/reference/supported-versions-and-ppas.md"]
    # No packaging source is configured, so this area is reported as unsupported
    # rather than passing. Add and map one to cover it.
    sources: []

reporting:
  fail_on_findings: true
  on_incomplete_coverage: neutral
  title: "Landscape docs testing"

tests:
  - reference-review

  # A deterministic counterpart to reference-completeness, for the parts of the
  # server interface that are machine-enumerable. Deterministic checks are always
  # your own command; the script below is the worked example from
  # tests/deterministic/ in the user-docs-testing repository, copied into this
  # project. The manifest has to be generated from the private server source, so
  # add a workflow step that writes it before this check runs.
  #
  # - name: server-api-surface
  #   run: "python3 scripts/undocumented_surface.py
  #          --manifest sources/landscape-server/openapi.json
  #          --targets docs/reference/api/**/*.md
  #          --output results/api-surface.json"
  #   results: "results/api-surface.json"

# ---------------------------------------------------------------------------
# WHAT THIS EXAMPLE DEMONSTRATES
#
# The Landscape reference set is predominantly SERVER-owned, so with only the
# public landscape-client source the coverage is deliberately poor:
#
#   Blocked (landscape-server is required and absent):
#     config/**, lsctl.md, database.md, logs.md, networking/**, terms/**
#   Unsupported (no available owner):
#     charm/** (optional source absent), supported-versions-and-ppas.md (no owner)
#   Skipped by policy:
#     release-notes/**, known-issues.md, _includes/**
#   Actually reviewable:
#     whatever client-owned reference you document — the public set has little
#
# That is the point. Such a run concludes `neutral`, not `success`: nothing was
# proven wrong, but almost nothing was verified either. Only once the private
# sources are accessible can this be described as a real Landscape review.
#
# PRIVATE-SOURCE SETUP
#   1. Create a fine-grained PAT with Contents: Read on the private repositories,
#      SSO-authorized for the canonical org if SAML is enforced.
#   2. Store it as the secret named by `auth:` above (SOURCE_REPO_TOKEN).
#   3. Add one `checkout:` block per source in your workflow, passing
#      `token: ${{ secrets.SOURCE_REPO_TOKEN }}` for the private ones.
#   4. Keep private-source runs on TRUSTED events only — see
#      ../../docs/reference/engines.md.
# ---------------------------------------------------------------------------
