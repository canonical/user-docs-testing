version: 1

reporting:
  mode: check-run
  fail_on_findings: true
  on_incomplete_coverage: neutral
  title: "Docs testing"
  labels:
    - "docs-testing"

tests:
  - name: tutorial-review
    type: agentic
    engine: copilot
    targets:
      - "docs/tutorial/tutorial.md"
    exclude: []
    sources: []
    generated:
      paths: []
      mode: skip
    skip_deterministically_covered: false

  - name: tutorial-validation
    type: agentic
    engine: copilot
    # Validation executes one tutorial end to end; the first matched target is used.
    targets:
      - "docs/tutorial/landscape-tutorial.md"
    exclude: []
    prerequisites: []
