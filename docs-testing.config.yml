version: 1

reporting:
  mode: check-run
  fail_on_findings: true
  on_incomplete_coverage: neutral
  title: "Docs testing"
  labels:
    - "docs-testing"

tests:
  # Static tutorial review — folds into the unified documentation run.
  - name: tutorial-review
    uses: tutorial-review
    targets:
      - "examples/tutorial/lxd-first-steps.md"
    exclude: []
    sources: []
    generated:
      paths: []
      mode: skip
    skip_deterministically_covered: false

  # Tutorial execution — runs in its own privileged workflow.
  - name: tutorial-validation
    uses: tutorial-validation
    # Validation executes one tutorial end to end; the first matched target is used.
    targets:
      - "examples/tutorial/basic-deployment.rst"
    exclude: []
    prerequisites: []
