# docs-testing.config.yml
#
# Copy this into your repository and adapt it. Every field is described in
# docs/reference/configuration.md; the advanced ones are deliberately not shown
# here. Run `docs-testing validate` after editing.

version: 1

# The documentation to test.
docs: "docs/reference/**/*.md"

# Documentation that is in the tree but should not be tested. Optional.
exclude:
  - "docs/reference/release-notes/**"

# The product this documentation describes. A finding has to be backed by
# evidence from a source, so a review with no source cannot prove anything.
# Add a `checkout:` block for each of these in .github/workflows/docs-testing.md.
sources:
  - name: product
    repo: my-org/my-product

# What to check. `docs-testing list` shows everything available.
tests:
  # Does the documentation contradict the product?
  - reference-review

  # Does product surface exist that the documentation never mentions?
  - reference-completeness

