[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "user-docs-testing"
version = "0.1.0.dev0"
description = "Test documentation against the product it describes."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["pyyaml>=5.4"]

[project.urls]
Homepage = "https://github.com/canonical/user-docs-testing"

[project.scripts]
docs-testing = "docs_testing.cli:main"

[tool.setuptools.packages.find]
include = ["docs_testing*"]
